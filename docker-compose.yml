services:
  postgres:
    image: postgres:16-alpine
    container_name: cocacola-event-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cocacola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cocacola_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cocacola"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  cocacola_postgres_data:
